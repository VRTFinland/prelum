[project]
site_name = "Prelum"
site_url = "https://vrtfinland.github.io/prelum/"
site_description = "A small HTTP service for rendering caller-supplied Typst projects"
repo_url = "https://github.com/VRTFinland/prelum"
repo_name = "Source code"
copyright = 'Copyright &copy; <a href="https://gisgro.com">GISGRO Oy</a> — Apache-2.0'
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "API" = [
    { "Render request" = "api/render.md" },
    { "Constraints and files-key rules" = "api/files-key-rules.md" },
    { "Output formats" = "api/output-formats.md" },
    { "Errors" = "api/errors.md" },
    { "OpenAPI" = "api/openapi.md" },
  ] },
  { "Examples" = "examples.md" },
  { "Operations" = [
    { "Configuration" = "operations/configuration.md" },
    { "Docker and releases" = "operations/docker.md" },
    { "Kubernetes" = "operations/kubernetes.md" },
    { "Fonts and packages" = "operations/fonts-and-packages.md" },
    { "Security model" = "operations/security-model.md" },
  ] },
  { "Contributing" = "https://github.com/VRTFinland/prelum/blob/main/CONTRIBUTING.md" },
  { "Licence" = "https://github.com/VRTFinland/prelum/blob/main/LICENSE" },
]

[project.theme]
variant = "modern"
favicon = "prelum-logo-concept.svg"
logo = "prelum-logo-concept-white.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.search]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
toc.permalink = true
