name: build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Optional v-prefixed tag supplied by the manual release workflow
        required: false
        type: string
    outputs:
      image_digest:
        description: Digest of the published multi-platform image
        value: ${{ jobs.merge.outputs.image_digest }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_METADATA_TAGS: |
    type=ref,event=branch,enable=${{ inputs.release_tag == '' }}
    type=semver,pattern={{version}},value=${{ inputs.release_tag || github.ref_name }}
    type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test image
        # Match the production Typst and font environment used by integration tests.
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          load: true
          tags: prelum:test-${{ github.run_id }}
          cache-from: type=gha,scope=prelum-linux-amd64
          cache-to: type=gha,mode=max,scope=prelum-linux-amd64
      - name: Run lint, type-check, and tests
        run: |
          # Separate tests simulate the optional Sentry dependency being absent.
          docker run --rm prelum:test-${{ github.run_id }} sh -c \
            "uv sync --locked --extra sentry \
            && uv run ruff check . \
            && uv run ty check app \
            && uv run pytest"

  build:
    needs: test
    # Only public main pushes and explicit release workflow calls publish images.
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name == 'push' || inputs.release_tag != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase registry image
        run: echo "REGISTRY_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: ${{ env.DOCKER_METADATA_TAGS }}
      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max,version=v1
          sbom: true
          cache-from: type=gha,scope=prelum-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=prelum-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    outputs:
      image_digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Set lowercase registry image
        run: echo "REGISTRY_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: ${{ env.DOCKER_METADATA_TAGS }}
      - name: Create manifest list and push
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --metadata-file "$RUNNER_TEMP/manifest-metadata.json" \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
          digest=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest-metadata.json")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid manifest digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign image by digest
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"
      - name: Verify image signature
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"
      - name: Inspect image
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"
