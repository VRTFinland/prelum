name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix, for example 0.2.0
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      already_released: ${{ steps.release.outputs.already_released }}
    steps:
      - name: Require a public repository
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          if [[ "$REPOSITORY_VISIBILITY" != "public" ]]; then
            echo "Releases are disabled unless the repository is public" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate version and create tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from the main branch, not $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the stable SemVer form X.Y.Z" >&2
            exit 1
          fi

          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$VERSION" != "$project_version" ]]; then
            echo "Requested version $VERSION does not match pyproject.toml version $project_version" >&2
            exit 1
          fi

          tag="v$VERSION"
          target_sha=$(git rev-parse HEAD)
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tagged_sha=$(git rev-list -n 1 "$tag")
            if [[ "$tagged_sha" != "$target_sha" ]]; then
              echo "$tag already points to $tagged_sha, not release commit $target_sha" >&2
              exit 1
            fi
            echo "$tag already points to the requested commit; continuing the release retry"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "Release $tag"
            git push origin "refs/tags/$tag"
          fi

          already_released=false
          if release_result=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>&1); then
            already_released=true
            echo "$tag already has a GitHub release; publication is complete"
          elif [[ "$release_result" != *"HTTP 404"* ]]; then
            echo "Could not determine whether $tag already has a GitHub release: $release_result" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "already_released=$already_released" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.already_released != 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  github-release:
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; nothing to create"
            exit 0
          fi
          repository=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repository}@${IMAGE_DIGEST}"
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes "Container image: \`$image\`"
