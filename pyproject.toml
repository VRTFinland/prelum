[project]
name = "prelum"
version = "1.0.0"
description = "FastAPI-based Typst renderer service (Python 3.14)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
# Error reporting is opt-in: a deployment that does not use Sentry should not carry a vendor
# SDK with network access it never calls. app/core/sentry.py degrades to a no-op without it.
sentry = ["sentry-sdk[fastapi,pure-eval]>=2.0.0"]

[dependency-groups]
dev = [
    "ty>=0.0.18",
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "anyio>=4.4.0",
    "hypothesis>=6.100.0",
    "httpx2>=2.12.0",
    "pyyaml>=6.0",
]
docs = [
    "mkdocs-material>=9.7.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "integration: compiles with the typst CLI, so it needs the binary and the report fonts on PATH",
]
filterwarnings = [
    "ignore::pytest.PytestConfigWarning"
]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.ty.environment]
python-version = "3.14"
root = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "N",      # pep8-naming
    "ASYNC",  # blocking calls in async functions
    "FAST",   # FastAPI-specific pitfalls
    "S",      # flake8-bandit
    "RUF",    # ruff-specific rules
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "FURB",   # refurb
    "PERF",   # perflint
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "TRY201", # verbose-raise
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "DTZ",    # flake8-datetimez
    "PTH",    # flake8-use-pathlib
    "T20",    # flake8-print
    "TID",    # flake8-tidy-imports
    "A",      # flake8-builtins
    "ERA",    # eradicate (commented-out code)
    "PT",     # flake8-pytest-style
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test functions and fixtures gain nothing from annotations pytest never reads. Assertions and
# throwaway credentials are the point of a test, and a blocking filesystem call in an async test
# body is harmless because nothing else shares its event loop.
"tests/**" = ["ANN", "S101", "S104", "S105", "S106", "ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
